[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodus_compute"
version = "0.7.3"
description = "Python client for Nodus workloads and agent sandboxes"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nodus, Inc." }]
keywords = ["gpu", "machine-learning", "training", "fine-tuning", "agents", "sandboxes", "compute"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "rich>=13.7", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mcp>=1.26,<2", "tomlkit==0.13.3", "json5==0.12.1"]

[project.scripts]
nodus = "nodus.cli:main"
nodus-mcp = "nodus.cli:mcp_main"

[project.urls]
Homepage = "https://nodus-compute.ai"
Documentation = "https://nodus-compute.ai/docs/"
"Agent guide" = "https://nodus-compute.ai/docs/guides/agents/"
"Agent documentation" = "https://nodus-compute.ai/llms.txt"
Source = "https://github.com/Nodus-compute/Nodus-sdk-python"
Issues = "https://github.com/Nodus-compute/Nodus-sdk-python/issues"

[tool.setuptools.package-data]
nodus = ["py.typed", "_operation_manifest.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nodus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
