        "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["ready_by"], "properties": {"ready_by": {"type": "string", "format": "date-time"}, "stop_at": {"type": "string", "format": "date-time"}}}}}},
        "responses": {"201": {"description": "Wake plan created", "content": {"application/json": {"schema": {"type": "object"}}}}, "default": {"description": "Invalid schedule, active schedule, authentication or transient failure.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}
      },
      "delete": {
        "operationId": "cancelResearchWorkspaceSchedule",
