      "DistributedObservedProgress": {
        "type": "object",
        "properties": {
          "completed_units": {
            "type": "integer"
          },
          "total_units": {
            "type": "integer"
          },
          "last_loss": {
            "type": "number"
          },
          "metric_rate": {
            "type": "number"
          },
          "metric_step": {
            "type": "integer"
          },
          "metric_total_steps": {
            "type": "integer"
          },
          "metric_epoch": {
            "type": "number"
          },
          "metric_total_epochs": {
            "type": "number"
          },
          "observed_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "completed_units",
          "total_units",
          "observed_at"
        ],
        "description": "Member observations for display. These values are not a saved recovery point and must not be summed across tensor or pipeline ranks."
      },
      "DistributedCustomerMember": {
        "type": "object",
        "properties": {
          "member_id": {
            "type": "string"
          },
          "node_rank": {
            "type": "integer"
          },
          "ready": {
            "type": "boolean"
          },
          "started": {
            "type": "boolean"
          },
          "active": {
            "type": "boolean"
          },
          "exit_code": {
            "type": "integer"
          },
          "observed_progress": {
            "$ref": "#/components/schemas/DistributedObservedProgress"
          }
        },
        "required": [
          "member_id",
          "node_rank",
          "ready",
          "started",
          "active"
        ]
      },
      "DistributedCustomerGroup": {
        "type": "object",
        "properties": {
          "group_id": {
            "type": "string"
          },
          "stage_id": {
            "type": "string"
          },
          "generation": {
            "type": "integer"
          },
          "phase": {
            "type": "string",
            "enum": [
              "assembling",
              "prepared",
              "starting",
              "running",
              "stopping",
              "closed"
            ]
          },
          "outcome": {
            "type": "string",
            "enum": [
              "completed",
              "failed",
              "cancelled"
            ]
          },
          "cleanup_state": {
            "type": "string",
            "enum": [
              "pending",
              "complete"
            ]
          },
          "required_members": {
            "type": "integer"
          },
          "ready_members": {
            "type": "integer"
          },
          "active_members": {
            "type": "integer"
          },
          "members": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/DistributedCustomerMember"
            }
          }
        },
        "required": [
          "group_id",
          "stage_id",
          "generation",
          "phase",
          "cleanup_state",
          "required_members",
          "ready_members",
          "active_members",
          "members"
        ],
        "description": "Latest distributed attempt for a workload stage. Ready counts record completed preparation. Active counts require started work with unexpired execution authority. Outcome and resource cleanup are separate."
      },
      "DistributedLogChunk": {
        "type": "object",
        "properties": {
          "group_id": {
            "type": "string"
          },
          "member_id": {
            "type": "string"
          },
          "node_rank": {
            "type": "integer"
          },
          "stage_id": {
            "type": "string"
          },
          "generation": {
            "type": "integer"
          },
          "offset": {
            "type": "integer"
          },
          "text": {
            "type": "string"
          },
          "data_base64": {
            "type": "string",
            "contentEncoding": "base64",
            "description": "Exact customer program bytes. Text provides a UTF-8 display representation."
          }
        },
        "required": [
          "group_id",
          "member_id",
          "node_rank",
          "stage_id",
          "generation",
          "offset",
          "text",
          "data_base64"
        ]
      }
    },
    "securitySchemes": {
      "ApiKey": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Nodus API key"
      }
    }
  },
  "externalDocs": {
    "url": "https://github.com/nodus-compute/Nodus-sdk-python/tree/main/docs"
  },
  "info": {
    "title": "Nodus Infrastructure Execution API",
    "version": "1.1.0",
    "description": "Provider-neutral infrastructure execution for AI workloads. This contract describes customer API-key workload, sandbox, managed model, research workspace, asset, webhook, and cloud observation operations. Console sign-in, operator, runner, and supplier protocols are outside its scope. Obtain a key using nodus login or the console. Use the deployment API origin as the base URL. No paid workload is executed by viewing this contract."
  },
  "openapi": "3.1.0",
  "paths": {
    "/v1/assets": {
      "get": {
        "operationId": "listAssets",
        "summary": "List imported code and datasets",
        "tags": [
          "Assets"
        ],
        "description": "Returns the latest 500 nondeleted assets, newest first. Generated workspace_source aliases expose current removability and shared-source references. workspace_source_storage reports their separate included account pool. Ordinary import limits and quota do not include these generated copies. Deleting an alias releases source storage only after the final reference is removed and exact cleanup is confirmed. Limits describe this deployment and may change.",
        "responses": {
          "200": {
            "description": "Asset list and storage limits",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AssetList"
                }
              }
            }
          },
          "500": {
            "description": "Asset listing or storage usage unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "default": {
            "description": "Error. The JSON error and message fields are stable. Additional fields may provide details. Authentication, rate limits, and transient failures apply to all operations.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/v1/assets/import": {
      "post": {
        "operationId": "importAsset",
        "summary": "Import code or a dataset",
        "tags": [
          "Assets"
        ],
        "description": "Import a GitHub repository, a Hugging Face dataset repository, or a public HTTPS file or archive. GitHub imports can use the team's connected GitHub account. URL imports use signed links for private downloads and reject tokens. GitHub, Hugging Face and URL imports may take up to ten minutes. It has no idempotency contract. After a timeout, inspect the asset list before repeating the request. Database connection queries return 202 after durable admission and export to Parquet or CSV in bounded workers. Poll the returned asset until ready or failed. Execution including queue time is bounded to ten minutes. reuse may return a ready export from the last 24 hours. New requests otherwise create fresh assets. Failed exports expose a safe error and retain their storage reservation until object cleanup succeeds.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AssetImportRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Import complete and asset ready",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Asset"
                }
              }
            }
          },
          "400": {
            "description": "Invalid import, source access, unsupported archive or size limit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Storage quota reached or two imports already in progress",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Asset staging or commit failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "502": {
            "description": "Object storage unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "default": {
            "description": "Error. The JSON error and message fields are stable. Additional fields may provide details. Authentication, rate limits, and transient failures apply to all operations.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "200": {
            "description": "Eligible query export reused",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Asset"
                }
              }
            }
          },
          "202": {
            "description": "Database query admitted. Poll GET /v1/assets/{id} until ready or failed. Disconnecting does not cancel admitted work.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Asset"
                }
              }
            }
          }
        }
      }
    },
    "/v1/assets/upload": {
      "post": {
        "operationId": "uploadAsset",
        "summary": "Upload a local file or archive",
        "tags": [
          "Assets"
        ],
        "description": "Send raw file bytes, not multipart form data. The server packages a file or extracts a supported archive. Read max_import_bytes and upload_idempotency from GET /v1/assets first. When upload_idempotency is true, send a stable Idempotency-Key and X-Nodus-SHA256 for verified replay of the same bytes and name. An in-progress, failed or deleted keyed upload returns an actionable conflict without creating a replacement. Unkeyed uploads retain their existing behavior. After an uncertain unkeyed response, inspect the asset list before repeating the request.",
        "parameters": [
          {
            "name": "name",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "default": "dataset"
            },
            "description": "Filename, including its archive extension when uploading an archive."
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256,
              "pattern": "^[!-~]+$"
            },
            "description": "Optional stable upload identity. Requires X-Nodus-SHA256. Replaying identical bytes and name returns the same ready asset."
          },
          {
            "name": "X-Nodus-SHA256",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$"
            },
            "description": "SHA-256 of the exact request bytes. Required with Idempotency-Key. Different bytes or name cannot reuse an upload key."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/octet-stream": {
              "schema": {
                "type": "string",
                "format": "binary"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Upload complete and asset ready",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Asset"
                }
              }
            }
          },
          "400": {
            "description": "Invalid file, archive or size limit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Storage quota reached or two imports already in progress",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Asset staging or commit failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "502": {
            "description": "Object storage unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "default": {
            "description": "Error. The JSON error and message fields are stable. Additional fields may provide details. Authentication, rate limits, and transient failures apply to all operations.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/v1/assets/{id}": {
      "get": {
        "operationId": "getAsset",
        "summary": "Read an asset owned by the authenticated team",
        "tags": [
          "Assets"
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Asset identifier returned by an import, upload or list."
          }
        ],
        "responses": {
          "200": {
            "description": "Asset metadata. This endpoint does not download file contents.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Asset"
                }
              }
            }
          },
          "404": {
            "description": "Asset not found in the authenticated team",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "default": {
            "description": "Authentication, rate limits and transient failures apply.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "delete": {
        "operationId": "deleteAsset",
        "summary": "Delete an unused asset",
        "tags": [
          "Assets"
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Asset identifier returned by an import, upload or list."
          }
        ],
        "responses": {
          "204": {
            "description": "Asset deleted"
          },
          "404": {
            "description": "Asset not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Asset is importing or used by an active workload",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Asset deletion could not be finalized",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "502": {
            "description": "Stored input could not be deleted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "default": {
            "description": "Error. The JSON error and message fields are stable. Additional fields may provide details. Authentication, rate limits, and transient failures apply to all operations.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/v1/benchmarks": {
      "post": {
        "operationId": "submitBenchmark",
        "summary": "Run a bounded workload matrix",
        "description": "Fans out ordinary workloads atomically with a single idempotency key. Each command can contain {{batch_size}}. Regions narrow workload data residency. Framework and multi-stage payloads are refused. GPU families use standard model names, never supplier SKUs.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/BenchmarkRequest"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            }
          }
        ],
        "responses": {
          "202": {
            "description": "Benchmark accepted or replayed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BenchmarkReport"
                }
              }
            }
          },
          "400": {
            "description": "Invalid matrix or workload"
          },
          "402": {
            "description": "Payment or credits required"
          },
          "409": {
            "description": "Idempotency conflict"
          },
          "503": {
            "description": "Admission unavailable"
          }
        }
      }
    },
    "/v1/benchmarks/{id}": {
      "get": {
        "operationId": "getBenchmark",
        "summary": "Read a benchmark report",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Per-cell observed costs, timings and workload links",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BenchmarkReport"
                }
              }
            }
          },
          "404": {
            "description": "Benchmark not found"
          }
        }
      }
    },
    "/v1/me": {
      "get": {
        "summary": "Verify the current login",
        "operationId": "identity",
        "responses": {
          "200": {
            "description": "Authenticated identity. Email may be empty for a team key.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "email": {
                      "type": "string"
                    },
                    "tenant": {
                      "type": "string"
                    },
                    "key_id": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Credentials are invalid, expired, or revoked"
          }
        }
      }
    },
    "/v1/sandboxes": {
      "post": {
        "operationId": "createSandbox",
        "summary": "Create a sandbox",
        "tags": [
          "Sandboxes"
        ],
        "description": "Creates a durable execution environment after Nodus matches infrastructure and authorizes customer-funded usage. 202 means accepted and can precede readiness. Payment and credits are checked before billable placement.",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Stable key for this logical operation. Reuse the same key and body after an uncertain response."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SandboxCreateRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Sandbox"
                }
              }
            },
            "headers": {
              "Idempotent-Replayed": {
                "description": "true when the response replays the original operation.",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "default": {
            "description": "Error. The code, message, and fix fields describe the rejection and its remedy.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SandboxError"
                }
              }
            }
          }
        }
      },
      "get": {
        "operationId": "listSandboxes",
        "summary": "List sandboxes",
        "tags": [
          "Sandboxes"
        ],
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "Opaque cursor returned by the previous page."
          },
          {
            "name": "name",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "Exact customer label filter."
          },
          {
            "name": "status",
            "in": "query",
            "schema": {
              "$ref": "#/components/schemas/SandboxState"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "sandboxes",
                    "next_cursor"
                  ],
                  "properties": {
                    "sandboxes": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Sandbox"
                      }
                    },
                    "next_cursor": {
                      "type": [
                        "string",
                        "null"
                      ]
                    }
                  }
                }
              }
            }
          },
          "default": {
            "description": "Error. The code, message, and fix fields describe the rejection and its remedy.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SandboxError"
                }
              }
            }
          }
        }
      }
    },
    "/v1/sandboxes/{id}": {
      "get": {
        "operationId": "getSandbox",
        "summary": "Get a sandbox",
        "tags": [
          "Sandboxes"
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Sandbox"
                }
              }
            }
          },
          "default": {
            "description": "Error. The code, message, and fix fields describe the rejection and its remedy.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SandboxError"
                }
              }
            }
          }
        }
      }
    },
    "/v1/sandboxes/{id}/agent-events": {
      "post": {
        "operationId": "submitAgentEvent",
        "summary": "Commit an event and wake its sandbox driver",
        "tags": [
          "Sandboxes"
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AgentEventRequest"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AgentEvent"
                }
              }
            }
          },
          "default": {
            "description": "Request refused",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SandboxError"
                }
              }
            }
          }
        },
        "description": "Account authentication is required. Receipt, immutable run, driver exec and normal lifecycle wake intent commit atomically. Exact source and event ID replay returns the same logical run. Changed command or payload conflicts. Normal billing, deadline, capacity and cleanup gates still apply. Queued events expire after seven days. Lost drivers have at most three attempts and unknown external effects block automatic restart."
      }
    },
    "/v1/sandboxes/{id}/agent-events/{event_id}": {
      "get": {
        "operationId": "getAgentEvent",
        "summary": "Read event handling state",
        "tags": [
          "Sandboxes"
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "event_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
              "maxLength": 128
            }
          },
          {
            "name": "source",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
              "maxLength": 128
            }
          }
