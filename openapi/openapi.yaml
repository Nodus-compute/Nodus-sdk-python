        "parameters": [{"name": "workspace_id", "in": "query", "schema": {"type": "string"}, "description": "Optional saved workspace owned by this account. The supplied configuration must match its current saved revision. Includes restore disk in direct-compute estimates. Returns 404 for an unavailable workspace or 409 for a changed configuration."}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ResearchWorkspaceConfiguration"}}}},
