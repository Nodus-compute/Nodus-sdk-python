      "ResearchWorkspaceConfiguration": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "environment",
          "gpu",
          "gpu_count",
          "gpu_memory_gb"
        ],
        "properties": {
          "kind": {"type": "string", "enum": ["", "workspace", "instance"], "description": "Omission or an empty value preserves a saved workspace. instance creates standalone compute with SSH and local disk only. The kind cannot change after creation. An existing SSH workspace remains a workspace."},
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9_.-]+$",
            "description": "Unique workspace name within the authenticated account. The names . and .. are not accepted."
          },
          "environment": {
            "type": "string",
            "enum": ["pytorch-cuda", "pytorch-rocm", "pytorch-cpu", "custom-cuda", "custom-rocm", "custom-cpu"],
            "description": "Qualified software environment for NVIDIA, AMD or CPU compute. Custom environments require a team-visible runtime_id."
          },
          "runtime_id": {"type": "string", "pattern": "^nodus:runtime:[a-f0-9]{64}$", "description": "Optional immutable image identity from capabilities.runtimes. Selects the workspace Linux distribution and software. Must match environment and remain qualified and visible to the team. Omission preserves the existing managed environment. The selected runtime cannot be changed when editing a saved project."},
          "gpu": {
            "type": "string",
            "minLength": 0,
            "maxLength": 64,
            "description": "GPU model, not a supplier SKU. Use an empty string for CPU instances. Launch requires an exact qualified configuration and eligible capacity."
          },
          "gpu_count": {
            "type": "integer",
            "enum": [0, 1, 2, 4, 8],
            "description": "Exact GPU count on one machine. Use zero for CPU instances. These accepted request values do not establish hardware qualification or current availability."
          },
          "gpu_memory_gb": {
            "type": "number",
            "minimum": 0,
            "maximum": 1024,
            "description": "Minimum required memory per GPU in GB, not the sum across devices. Positive for GPU instances and zero for CPU instances."
          },
          "compute_class": {"type": "string", "enum": ["accelerator", "vm"], "description": "Omission retains GPU execution. vm requests a CPU-only workspace and requires capabilities.cpu_instances, a CPU environment, empty gpu, zero gpu_count and zero gpu_memory_gb."},
          "gpu_form_factor": {"type": "string", "enum": ["", "pcie", "sxm", "nvl"], "description": "Optional required GPU form factor. Omission permits any form factor. Requires direct workspace compute and cannot be set for CPU instances. A selected form factor is enforced during quoting and placement."},
          "vcpus": {"type": "integer", "minimum": 0, "maximum": 256, "description": "Minimum vCPUs on a GPU machine. Omission or zero keeps its included resources. CPU instances require exactly 2, 4, 8, 16 or 32 vCPUs."},
          "host_memory_gb": {"type": "number", "minimum": 0, "maximum": 4096, "description": "Minimum system RAM in GB, separate from GPU memory. Omission or zero keeps included RAM on GPU machines. CPU instances require a positive value. Custom RAM requires direct workspace compute."},
          "disk_gb": {"type": "integer", "anyOf": [{"const": 0}, {"minimum": 80, "maximum": 2048}], "description": "Runtime storage in decimal GB. Omission or zero preserves the existing 80 GB floor. Explicit sizes from 80 through 2048 are accepted. This is separate from the saved project capacity in size_gb. Restoring saved files can require additional allocation."},
          "size_gb": {
            "type": "number",
            "minimum": 0,
            "maximum": 10,
            "description": "Instances require zero and have no saved project storage. For workspaces, omit to use the deployment capacity, or send a positive capacity within capabilities.storage_limit_bytes. With storage_policy_version included-10gb-v1 or r2-standard-10gb-account-v1, send exactly 10 for the 10,000,000,000-byte per-workspace capacity. The account policy shares its free allowance across workspaces. Other deployments use GiB and their displayed capacity limit."
          },
          "ssh_authorized_key": {
            "type": "string",
            "maxLength": 8192,
            "description": "Plain SSH public keys, one per line, up to 20. Private keys, certificates and authorized_keys options are rejected. Machines also admit every SSH key saved by a team member. Instances and SSH-only workspaces on direct compute may omit this field. SSH is then unavailable until a key exists, and a running machine admits newly saved team keys within seconds. Deployments without direct compute still require it and return 400 invalid_ssh_authorized_key when it is missing."
          }
        },
        "allOf": [{
          "if": {"required": ["kind"], "properties": {"kind": {"const": "instance"}}},
          "then": {
            "properties": {"size_gb": {"const": 0}}
          },
          "else": {"properties": {"size_gb": {"minimum": 9.5367431640625e-07}}}
        }],
        "if": {"required": ["compute_class"], "properties": {"compute_class": {"const": "vm"}}},
        "then": {
          "required": ["vcpus", "host_memory_gb"],
          "properties": {
            "environment": {"enum": ["pytorch-cpu", "custom-cpu"]},
            "gpu": {"const": ""},
            "gpu_count": {"const": 0},
            "gpu_memory_gb": {"const": 0},
            "gpu_form_factor": {"const": ""},
            "vcpus": {"enum": [2, 4, 8, 16, 32]},
            "host_memory_gb": {"exclusiveMinimum": 0}
          }
        },
        "else": {
          "properties": {
            "gpu": {"minLength": 1},
            "gpu_count": {"enum": [1, 2, 4, 8]},
            "gpu_memory_gb": {"exclusiveMinimum": 0}
          }
        }
      },
