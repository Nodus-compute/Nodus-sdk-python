        "description": "Abandons the transfer and schedules cleanup of its owned upload data. Existing saved files remain intact. A successful response does not claim that uncertain writes or their cleanup have completed.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            },
