{
  "components": {
    "schemas": {
      "SSHKey": {
        "type": "object",
        "required": ["fingerprint", "public_key", "name", "added_at"],
        "properties": {"fingerprint": {"type": "string"}, "public_key": {"type": "string"}, "name": {"type": "string"}, "added_at": {"type": "string", "format": "date-time"}}
      },
      "ComputeGroup": {
        "type": "object",
        "required": ["id", "sweep_id", "kind", "size", "running", "succeeded", "failed"],
        "properties": {"id": {"type": "string", "description": "Sweep item id, sweep_ followed by the sweep id."}, "sweep_id": {"type": "string"}, "kind": {"type": "string", "enum": ["sweep"]}, "size": {"type": "integer"}, "running": {"type": "integer"}, "succeeded": {"type": "integer"}, "failed": {"type": "integer"}}
      },
      "ComputeItem": {
        "type": "object",
        "required": ["id", "type", "name", "gpu", "gpu_count", "gpu_memory_gb", "state", "status_text", "created_at", "started_at", "ended_at", "launched_by", "group", "resource"],
        "properties": {
          "id": {"type": "string"},
          "type": {"type": "string", "enum": ["instance", "training", "workspace"]},
          "name": {"type": "string"},
          "gpu": {"type": ["string", "null"]},
          "gpu_count": {"type": "integer"},
          "gpu_memory_gb": {"type": ["number", "null"]},
          "state": {"type": "string", "enum": ["starting", "ready", "running", "recovering", "stopping", "stopped", "paused", "succeeded", "failed", "cancelled"], "description": "paused is frozen training. It holds no compute and lists under history."},
          "status_text": {"type": "string"},
          "created_at": {"type": "string", "format": "date-time"},
          "started_at": {"type": ["string", "null"], "format": "date-time"},
          "ended_at": {"type": ["string", "null"], "format": "date-time"},
          "launched_by": {
            "type": "object",
            "required": ["client", "user_id", "user_name", "api_key_id", "api_key_name"],
            "properties": {
              "client": {"type": "string", "enum": ["console", "python-sdk", "cli", "mcp", "claude-code", "codex", "cursor", "api"]},
              "user_id": {"type": ["string", "null"]},
              "user_name": {"type": ["string", "null"]},
              "api_key_id": {"type": ["string", "null"]},
              "api_key_name": {"type": ["string", "null"]}
            }
          },
          "group": {"oneOf": [{"type": "null"}, {"$ref": "#/components/schemas/ComputeGroup"}]},
          "resource": {"type": "object", "required": ["kind", "id"], "properties": {"kind": {"type": "string", "enum": ["research_workspace", "workload", "sweep"]}, "id": {"type": "string"}}}
        }
      },
      "ComputeList": {
        "type": "object",
        "required": ["items", "next_cursor", "summary"],
        "properties": {
          "items": {"type": "array", "items": {"$ref": "#/components/schemas/ComputeItem"}},
          "next_cursor": {"type": ["string", "null"]},
          "summary": {"type": "object", "required": ["running"], "properties": {"running": {"type": "object", "required": ["instance", "training", "workspace"], "properties": {"instance": {"type": "integer"}, "training": {"type": "integer"}, "workspace": {"type": "integer"}}}}}
        }
      },
      "AgentEvent": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "source",
          "event_id",
          "run_id",
          "exec_id",
          "state",
          "reason",
          "created_at",
          "expires_at"
        ],
        "properties": {
          "source": {
            "type": "string",
            "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
            "maxLength": 128
          },
          "event_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
            "maxLength": 128
          },
          "run_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
            "maxLength": 128
          },
          "exec_id": {
            "type": "string"
          },
          "state": {
            "type": "string",
            "enum": [
              "queued",
              "running",
              "blocked",
              "handled",
              "expired"
            ]
          },
          "reason": {
            "type": "string"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "AgentEventRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "source",
          "event_id",
          "run",
          "command"
        ],
        "properties": {
          "source": {
            "type": "string",
            "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
            "maxLength": 128
          },
          "event_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
            "maxLength": 128
          },
          "run": {
            "$ref": "#/components/schemas/AgentRunRequest"
          },
          "command": {
            "type": "array",
            "minItems": 1,
            "items": {
              "type": "string"
            },
            "description": "Explicit driver argv, validated with normal exec bounds. No environment or stdin fields are accepted. Include the run identity in the command as required by your driver."
          }
        }
      },
      "AgentReceipt": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "decision": {
            "type": "string"
          },
          "step_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
            "maxLength": 128
          },
          "external_key": {
            "type": "string"
          },
          "revision": {
            "type": "integer"
          },
          "result": {
            "type": "string",
            "format": "byte",
            "maxLength": 349528,
            "description": "Base64 of exact UTF-8 json-v1 bytes, at most 256 KiB decoded. Objects use sorted keys and compact encoding. Nonfinite numbers, duplicate keys and non-JSON values are refused."
          }
        },
        "required": [
          "decision",
          "step_id",
          "external_key",
          "revision"
        ]
      },
      "AgentResolution": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "step_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
            "maxLength": 128
          },
          "expected_revision": {
            "type": "integer",
            "minimum": 1
          },
          "decision": {
            "type": "string",
            "enum": [
              "completed",
              "no_effect",
              "cancelled"
            ]
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1024
          },
          "evidence_digest": {
            "type": "string",
            "pattern": "^sha256:[a-f0-9]{64}$"
          },
          "result": {
            "type": "string",
            "format": "byte",
            "maxLength": 349528,
            "description": "Base64 of exact UTF-8 json-v1 bytes, at most 256 KiB decoded. Objects use sorted keys and compact encoding. Nonfinite numbers, duplicate keys and non-JSON values are refused."
          }
        },
        "required": [
          "step_id",
          "expected_revision",
          "decision",
          "reason",
          "evidence_digest"
        ]
      },
      "AgentRun": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "run_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
            "maxLength": 128
          },
          "name": {
            "type": "string",
            "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
            "maxLength": 128
          },
          "version": {
            "type": "string",
            "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
            "maxLength": 128
          },
          "image_digest": {
            "type": "string",
            "pattern": "^sha256:[a-f0-9]{64}$"
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "blocked",
              "completed",
              "cancelled",
              "expired"
            ]
          },
          "input": {
            "type": "string",
            "format": "byte",
            "maxLength": 349528,
            "description": "Base64 of exact UTF-8 json-v1 bytes, at most 256 KiB decoded. Objects use sorted keys and compact encoding. Nonfinite numbers, duplicate keys and non-JSON values are refused."
          },
          "result": {
            "type": "string",
            "format": "byte",
            "maxLength": 349528,
            "description": "Base64 of exact UTF-8 json-v1 bytes, at most 256 KiB decoded. Objects use sorted keys and compact encoding. Nonfinite numbers, duplicate keys and non-JSON values are refused."
          },
          "epoch": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "run_id",
          "name",
          "version",
          "image_digest",
          "status",
          "epoch"
        ]
      },
      "AgentRunRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "run_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
            "maxLength": 128
          },
          "name": {
            "type": "string",
            "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
            "maxLength": 128
          },
          "version": {
            "type": "string",
            "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
            "maxLength": 128
          },
          "image_digest": {
            "type": "string",
            "pattern": "^sha256:[a-f0-9]{64}$"
          },
          "encoding": {
            "type": "string",
            "enum": [
              "json-v1"
            ]
          },
          "input": {
            "type": "string",
            "format": "byte",
            "maxLength": 349528,
            "description": "Base64 of exact UTF-8 json-v1 bytes, at most 256 KiB decoded. Objects use sorted keys and compact encoding. Nonfinite numbers, duplicate keys and non-JSON values are refused."
          }
        },
        "required": [
          "run_id",
          "name",
          "version",
          "image_digest",
          "encoding",
          "input"
        ]
      },
      "AgentStep": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "checkpoint_id": {
            "type": "string",
            "description": "Verified ready or committed state captured for this step's fenced claim. A completed reconciliation must explicitly select matching state when checkpoint recovery is enabled."
          },
          "checkpoint_status": {
            "type": "string",
            "enum": ["ready", "committed"],
            "description": "Publication status of the matching checkpoint candidate. Ready files are verified but do not yet replace committed recovery state."
          },
          "step_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
            "maxLength": 128
          },
          "name": {
            "type": "string",
            "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
            "maxLength": 128
          },
          "version": {
            "type": "string",
            "pattern": "^[A-Za-z0-9:_.-]{1,128}$",
            "maxLength": 128
          },
          "effect": {
            "type": "string",
            "enum": [
              "external",
              "pure",
              "idempotent"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "started",
              "completed",
              "failed",
              "unknown",
              "expired"
            ]
          },
          "revision": {
            "type": "integer",
            "minimum": 1
          },
          "attempts": {
            "type": "integer",
            "minimum": 1,
            "maximum": 3
          }
        },
        "required": [
          "step_id",
          "name",
          "version",
          "effect",
          "status",
          "revision",
          "attempts"
        ]
      },
      "AgentStepPage": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "steps": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AgentStep"
            },
            "maxItems": 100
          },
          "next_after": {
            "type": "string"
          }
        },
        "required": [
          "steps"
        ]
      },
      "Artifact": {
        "type": "object",
        "properties": {
          "manifest_id": {
            "type": "string"
          },
          "stage_id": {
            "type": "string"
          },
          "generation": {
            "type": "integer"
          },
          "sequence": {
            "type": "integer"
          },
          "manifest": {
            "type": "object",
            "description": "Checkpoint manifest metadata. Use outputs/download for produced files."
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Asset": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "kind": {
            "type": "string",
            "description": "Includes workspace_source for a generated workspace project revision. These copies use their separate included source pool."
          },
          "name": {
            "type": "string"
          },
          "state": {
            "type": "string",
            "description": "Current asset state: importing, ready, failed, deleting or deleted."
          },
          "revision": {
            "type": "string"
          },
          "sha256": {
            "type": "string"
          },
          "stored_bytes": {
            "type": "integer"
          },
          "imported_bytes": {
            "type": "integer"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "ready_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "deleted_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "export": {
            "$ref": "#/components/schemas/ConnectionExport"
          },
          "error": {
            "type": "string",
            "description": "Value-free terminal query export error. Failed assets remain observable after cleanup, with zero stored bytes once their reservation is released."
          },
          "workspace_source": {
            "$ref": "#/components/schemas/WorkspaceSourceAlias"
          }
        }
      },
      "AssetImportRequest": {
        "type": "object",
        "required": [
          "kind"
        ],
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "github",
              "huggingface",
              "url",
              "connection_query"
            ]
          },
          "url": {
            "type": "string",
            "description": "Public HTTPS direct download URL for kind=url. Private downloads use signed links."
          },
          "repo": {
            "type": "string",
            "description": "owner/name for GitHub or a Hugging Face dataset. Matching HTTPS repository URLs are also accepted."
          },
          "ref": {
            "type": "string",
            "maxLength": 255,
            "default": "main",
            "description": "Repository revision. Omitted or empty selects main. Carriage returns and newlines are rejected."
          },
          "files": {
            "type": [
              "array",
              "null"
            ],
            "maxItems": 100,
            "items": {
              "type": "string"
            },
            "description": "Hugging Face dataset file patterns. Omitted selects recognized data file extensions. GitHub imports include the repository archive."
          },
          "token": {
            "type": "string",
            "writeOnly": true,
            "description": "Optional GitHub or Hugging Face credential. Rejected for URL imports."
          },
          "connection_id": {
            "type": "string",
            "description": "Database connection name or ID for connection_query. Requires read or readwrite scope and an active pinned credential."
          },
          "sql": {
            "type": "string",
            "maxLength": 60000,
            "description": "One SELECT or WITH statement, executed in a read-only transaction with a ten-minute timeout."
          },
          "format": {
            "type": "string",
            "enum": [
              "parquet",
              "csv"
            ],
            "default": "parquet"
          },
          "branch": {
            "type": "string",
            "description": "Optional Neon branch assertion. Must match the branch already verified on the connection."
          },
          "reuse": {
            "type": "boolean",
            "default": false,
            "description": "Reuse an eligible ready export for this tenant, connection, exact SQL apart from outer whitespace, branch and format from the last 24 hours."
          }
        },
        "description": "The server requires the source appropriate to kind. Import limits are deployment specific and returned by GET /v1/assets. Archives cannot contain links, special files, unsafe paths or more than 10000 files. Connection queries produce data.parquet or data.csv inside a normal input asset, with a 5 GB and 50 million row limit. Existing tenant storage quota also applies. Credentials remain on the control plane."
      },
      "AssetList": {
        "type": "object",
        "properties": {
          "assets": {
            "type": "array",
            "maxItems": 500,
            "items": {
              "$ref": "#/components/schemas/Asset"
            }
          },
          "max_import_bytes": {
            "type": "integer",
            "description": "Maximum source bytes for one import or upload."
          },
          "storage_quota_bytes": {
            "type": "integer"
          },
          "staged_bytes": {
            "type": "integer"
          },
          "stored_bytes": {
            "type": "integer",
            "description": "Ordinary asset bytes, excluding generated workspace source copies."
          },
          "billing_enabled": {
            "type": "boolean",
            "const": false
          },
          "workspace_source_storage": {
            "$ref": "#/components/schemas/WorkspaceSourceStorage"
          },
          "upload_idempotency": {
            "type": "boolean",
            "description": "True when uploads support persistent request keys bound to exact content hashes. Clients requiring durable upload receipts must check this capability before sending bytes."
          }
        },
        "required": [
          "assets",
          "max_import_bytes",
          "storage_quota_bytes",
          "staged_bytes",
          "stored_bytes",
          "billing_enabled"
        ]
      },
      "BenchmarkCell": {
        "type": "object",
        "properties": {
          "gpu_family": {
            "type": "string"
          },
          "batch_size": {
            "type": "integer"
          },
          "region": {
            "type": "string"
          },
          "repetition": {
            "type": "integer"
          },
          "budget_usd": {
            "type": "number",
            "deprecated": true,
            "description": "Deprecated compatibility field. Customer spending limits are not enforced."
          },
          "workload_id": {
            "type": "string"
          },
          "workload_url": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "spend_usd": {
            "type": "number",
            "description": "Posted workload ledger charges. Active and unsettled usage may be absent."
          },
          "wall_seconds": {
            "type": [
              "number",
              "null"
            ],
            "description": "Elapsed time from admission through terminal status or report time."
          },
          "unit_metrics": {
            "$ref": "#/components/schemas/UnitMetrics"
          },
          "units_per_second": {
            "type": [
              "number",
              "null"
            ],
            "description": "Observed completed units divided by wall_seconds. Missing observations are not estimated."
          }
        }
      },
      "BenchmarkMatrix": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "gpu_families",
          "batch_sizes",
          "regions",
          "repetitions"
        ],
        "properties": {
          "gpu_families": {
            "type": "array",
            "minItems": 1,
            "maxItems": 64,
            "items": {
              "type": "string"
            }
          },
          "batch_sizes": {
            "type": "array",
            "minItems": 1,
            "maxItems": 64,
            "items": {
              "type": "integer",
              "minimum": 1,
              "maximum": 1000000
            }
          },
          "regions": {
            "type": "array",
            "minItems": 1,
            "maxItems": 64,
            "items": {
              "type": "string"
            }
          },
          "repetitions": {
            "type": "integer",
            "minimum": 1,
            "maximum": 64
          }
        }
      },
      "BenchmarkReport": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "running",
              "completed",
              "failed"
            ]
          },
          "budget_usd": {
            "type": "number",
            "deprecated": true,
            "description": "Deprecated compatibility field. Customer spending limits are not enforced."
          },
          "spend_usd": {
            "type": "number"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "cells": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/BenchmarkCell"
            }
          }
        }
      },
      "BenchmarkRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "workload",
          "matrix"
        ],
        "properties": {
          "workload": {
            "$ref": "#/components/schemas/WorkloadPayload"
          },
          "matrix": {
            "$ref": "#/components/schemas/BenchmarkMatrix"
          },
          "budget_usd": {
            "type": "number",
            "description": "Deprecated compatibility field. Customer spending limits are not enforced.",
            "deprecated": true
          }
        }
      },
      "CheckpointSummary": {
        "type": "object",
        "properties": {
          "manifest_id": {
            "type": "string"
          },
          "generation": {
            "type": "integer"
          },
          "sequence": {
            "type": "integer"
          },
          "created_at": {
            "type": "string",
            "format": "date-time",
            "description": "Original commit time of the latest useful recovery checkpoint. Independent of event pagination and unchanged by commit retries or artifact-only uploads."
          }
        }
      },
      "Continuity": {
        "type": "object",
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "",
              "checkpointed",
              "restartable",
              "ephemeral"
            ],
            "description": "Top-level empty/omitted defaults to checkpointed. A stage with omitted mode inherits workload mode and resume behavior. Checkpoint paths inherit separately."
          },
          "resume_on_interruption": {
            "type": "boolean",
            "default": true,
            "description": "Omission defaults to true. Explicit false disables resumption. Per-stage mode omission inherits workload mode and resume behavior."
          },
          "checkpoint_paths": {
            "type": "array",
            "maxItems": 64,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 512
            },
            "description": "Literal normalized paths relative to the code folder, with at most 512 UTF-8 bytes per path. Select files or folders containing recovery state. Empty or omitted at workload level defaults new submissions to [\"state\"]. The runner exposes this folder as NODUS_CHECKPOINT_DIR. Only explicitly selected paths are saved, not installed dependencies elsewhere in the code folder. Empty or omitted at stage level inherits workload paths, a nonempty list overrides them, and [\".\"] explicitly selects the whole folder. Absolute paths, traversal, backslashes, colons, control characters and the .nodus subtree are rejected. Missing paths are skipped without widening the selection. Dependencies outside selected paths must be recreated by the image or command. Final result files are independent. Framework shortcuts apply workload-level paths to their generated stages. Stage-specific paths alongside a framework shortcut are not supported, use explicit stages instead."
          },
          "integration": {
            "type": "string",
            "enum": [
              "",
              "none",
              "auto",
              "hf-trainer-v1"
            ],
            "description": "Application save and resume integration. New submissions leave application checkpoint preparation disabled unless auto or hf-trainer-v1 is explicitly selected. Omission and none preserve the original source and application-managed checkpoint behavior. A stage inherits an explicit workload selection when omitted. Imported source alone does not enable preparation. auto attempts the supported framework adapter and otherwise runs the original command with application-managed checkpoints. hf-trainer-v1 requires supported Hugging Face Trainer preparation and runtime validation. Explicit managed selections require execution-v2, enabled preparation and source.asset_id. Previously accepted submissions keep their original selection. Prepared source does not itself prove that application state has been saved or recovered."
          }
        }
      },
      "CostBreakdown": {
        "type": "object",
        "properties": {
          "runtime_hours": {
            "type": "number"
          },
          "provision_hours": {
            "type": "number"
          },
          "billed_hours": {
            "type": "number"
