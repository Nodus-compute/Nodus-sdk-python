            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200,
              "default": 100
            },
            "description": "Maximum number of event rows in this page."
          }
        ],
        "responses": {
          "200": {
            "description": "Persisted RL event page",
            "headers": {
              "Cache-Control": {
