        "tags": ["Research workspaces"],
        "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}, {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 1}}],
        "responses": {"200": {"description": "Schedule cancelled", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ResearchWorkspace"}}}}}
      }
    },
    "/v1/research-workspaces/{id}/stop": {
      "post": {
        "operationId": "stopResearchWorkspace",
        "summary": "Save project files and stop the specified compute session",
        "tags": ["Research workspaces"],
        "description": "Stops the original session_id, not whichever replacement session exists when a retry arrives. Preserve both session_id and Idempotency-Key for every retry. A new stop targeting a replacement requires a new pair. Returns the current workspace view, which may refer to a newer session during a delayed replay. Poll state and saving_for_termination to observe final-save and compute-release progress. A 200 response alone does not confirm supplier resource release. Retained storage is not deleted.",
        "parameters": [
          {"name": "id", "in": "path", "required": true, "schema": {"type": "string"}, "description": "Saved workspace identifier."},
          {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 1}, "description": "Stable retry key paired with the original session_id in the request body."}
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {"schema": {"$ref": "#/components/schemas/ResearchWorkspaceStopRequest"}}
          }
        },
        "responses": {
          "200": {
            "description": "Stop handled or replayed without a pending final save. Inspect workspace state for compute-release progress.",
            "headers": {
              "Idempotent-Replayed": {"description": "true when the original stop is replayed.", "schema": {"type": "string"}}
            },
            "content": {
              "application/json": {"schema": {"$ref": "#/components/schemas/ResearchWorkspace"}}
            }
          },
          "202": {
            "description": "Final project save remains pending before compute release",
            "headers": {
              "Idempotent-Replayed": {"description": "true when the original stop is replayed.", "schema": {"type": "string"}}
            },
            "content": {
              "application/json": {"schema": {"$ref": "#/components/schemas/ResearchWorkspace"}}
            }
          },
          "default": {
            "description": "400 for a missing retry key, missing body or invalid session_id. 404 for a workspace or session outside this account, or a session belonging to another workspace. 409 for a state or idempotency conflict. Authentication, rate limits and transient failures also apply.",
            "content": {
              "application/json": {"schema": {"$ref": "#/components/schemas/SandboxError"}}
            }
          }
        }
      }
    },
    "/v1/research-workspaces/{id}/connections": {
      "post": {
        "operationId": "connectResearchWorkspace",
        "summary": "Open a ready browser tool or get desktop SSH configuration",
        "tags": ["Research workspaces"],
        "description": "Requires a current authorized compute session with reachable, healthy tools. editor and notebook return a one-time HTTPS URL. ssh requires a saved SSH public key and returns OpenSSH configuration, using either the authenticated HTTPS proxy command or a direct gateway with a known_hosts entry. Browser tools use isolated per-tool origins, not the API or console origin. Account credentials never reach the guest. Revocation, session replacement or expired authorization closes access, including active browser streams. Closing a client does not stop compute.",
        "parameters": [
          {"name": "id", "in": "path", "required": true, "schema": {"type": "string"}, "description": "Saved workspace identifier."}
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {"schema": {"$ref": "#/components/schemas/ResearchWorkspaceConnectionRequest"}}
          }
        },
        "responses": {
          "200": {
            "description": "One-time browser connection URL or desktop SSH configuration, depending on tool",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [{"$ref": "#/components/schemas/ResearchWorkspaceBrowserConnection"}, {"$ref": "#/components/schemas/ResearchWorkspaceSSHConnection"}, {"$ref": "#/components/schemas/WorkspaceWebSocketSSHConnection"}]
                }
              }
            }
          },
          "default": {
            "description": "400 for an invalid tool. 404 for a workspace not owned by this account. 409 workspace_not_ready until the session and tools are ready. 503 if browser access or SSH configuration is unavailable. Authentication, rate limits and transient failures also apply.",
            "content": {
              "application/json": {"schema": {"$ref": "#/components/schemas/SandboxError"}}
            }
          }
        }
      }
    },
    "/v1/research-workspaces/{id}/ssh-stream": {
      "get": {
        "operationId": "streamWorkspaceSSH",
        "summary": "Connect an authenticated SSH stream to the current workspace session",
        "tags": ["Research workspaces"],
        "description": "Upgrades an authenticated request to a WebSocket using nodus-workspace-ssh-v1. Binary messages carry the SSH byte stream. Use the session and generation from a fresh SSH connection response. Query strings, Origin and Cookie headers are rejected. Authorization must contain one current Bearer credential. Nodus checks workspace ownership and the pinned session before connecting and while forwarding. The guest still authenticates the customer's SSH public key. Either side closing or authorization expiry closes the stream. The CLI proxy opens this endpoint without a browser or credential in its command line.",
        "parameters": [
          {"name": "id", "in": "path", "required": true, "schema": {"type": "string"}},
          {"name": "X-Nodus-Workspace-Session", "in": "header", "required": true, "schema": {"type": "string"}, "description": "Pinned compute session identifier from the SSH connection response."},
          {"name": "X-Nodus-Workspace-Generation", "in": "header", "required": true, "schema": {"type": "string", "pattern": "^[1-9][0-9]*$"}, "description": "Exact positive decimal session generation from the SSH connection response."},
          {"name": "Sec-WebSocket-Protocol", "in": "header", "required": true, "schema": {"type": "string", "const": "nodus-workspace-ssh-v1"}}
        ],
        "responses": {
          "101": {"description": "Authenticated binary SSH stream. The standard WebSocket handshake headers apply."},
          "default": {"description": "400 invalid_ssh_connection for an invalid handshake identity. 409 workspace_not_ready for a stale or unavailable session. 503 ssh_unavailable when the stream or guest is unavailable. Authentication and rate limits also apply.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SandboxError"}}}}
        }
      }
    },
    "/v1/research-workspaces/{id}/connections/retry": {
      "post": {
        "operationId": "retryResearchWorkspaceConnection",
        "summary": "Retry one browser connection without restarting compute",
        "tags": ["Research workspaces"],
        "description": "Explicitly schedules a safe retry for the selected tool on the current workspace session. It does not issue a connection URL, start compute or guarantee that the tool is ready. An uncertain remote operation cannot be retried until its outcome is reconciled. After acceptance, read the workspace again and use its connection readiness before opening the tool. A rejected retry does not prevent stopping compute. Available only when the deployment enables connection retry.",
        "parameters": [
          {"name": "id", "in": "path", "required": true, "schema": {"type": "string"}, "description": "Research workspace identifier owned by this account."}
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {"schema": {"$ref": "#/components/schemas/ResearchWorkspaceConnectionRetryRequest"}}
          }
        },
        "responses": {
          "202": {
            "description": "Retry scheduled. This is not a ready connection or browser grant.",
            "headers": {
              "Cache-Control": {"schema": {"type": "string", "const": "no-store"}}
            },
            "content": {
              "application/json": {"schema": {"$ref": "#/components/schemas/ResearchWorkspaceConnectionRetry"}}
            }
          },
          "default": {
            "description": "400 invalid_tool, invalid_json or invalid_body for invalid input. 404 not_found for an unavailable owned workspace. 409 connection_not_retryable when a safe retry cannot be scheduled. 503 connection_unavailable when disabled or gateway authority is unavailable. 500 connection_retry_failed for an unexpected internal failure. Authentication and rate limits also apply.",
            "content": {
              "application/json": {"schema": {"$ref": "#/components/schemas/SandboxError"}}
            }
          }
        }
      }
    },
