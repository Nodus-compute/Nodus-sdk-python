        "responses": {
          "200": {
            "description": "List projects available for connection",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/GoogleCloudAuthorizationResponse"
                }
              }
            }
          },
          "default": {
            "description": "Stable Nodus error and message fields.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "page_token",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 4096
            }
          }
        ]
      }
    },
    "/v1/cloud-google-authorizations/{id}/connect": {
      "post": {
        "operationId": "connectGoogleCloudProject",
        "summary": "Advance Google Cloud project setup",
        "tags": [
          "Cloud observation"
        ],
        "description": "Requires the same current team administrator who started consent. Binds one project and optional billing location, then advances one resumable setup stage per call. Repeat the identical selection while the response is 202. Existing IAM policies and session ownership are preserved. Billing preparation is optional and can be skipped. Completion requires verified read-only access and returns 200 with the observation connection. Completion erases the temporary administrator token and queues collection. No compute is created.",
        "responses": {
          "202": {
            "description": "Advance Google Cloud project setup",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/GoogleCloudAuthorizationResponse"
                }
              }
            }
          },
          "default": {
            "description": "Stable Nodus error and message fields.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "200": {
            "description": "Verified connection completed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/GoogleCloudAuthorizationResponse"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "project_id": {
                    "type": "string",
                    "pattern": "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
                  },
                  "billing_location": {
                    "type": "string",
                    "enum": [
                      "",
                      "US",
                      "EU"
                    ]
                  },
                  "skip_billing": {
                    "type": "boolean"
                  }
                },
                "required": [
                  "project_id"
                ]
              }
            }
          }
        }
      }
    },
    "/v1/cloud-google-authorizations/{id}": {
