    "/v1/research-workspaces/{id}/transfers/{transfer}/segments/{segment}": {
      "put": {
        "operationId": "uploadWorkspaceTransferSegment",
        "summary": "Upload one declared archive segment",
        "tags": [
          "Research workspaces"
        ],
        "description": "Send the exact bytes identified by this zero-based segment index in the manifest. Content-Length is required and must match the declared segment. Content-Type must be exactly application/octet-stream. Chunked transfer encoding is not accepted. Segments are checked against their declared size and SHA256. Retry with the same transfer and segment after an uncertain reply.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Workspace identifier owned by this account."
          },
          {
            "name": "transfer",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "Transfer identifier returned by begin."
          },
          {
            "name": "segment",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 0
            },
            "description": "Zero-based manifest segment index."
          },
          {
            "name": "Content-Length",
            "in": "header",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 512,
              "maximum": 67108864,
              "multipleOf": 512
            },
            "description": "Exact segment byte length."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/octet-stream": {
              "schema": {
                "type": "string",
                "format": "binary",
                "description": "Exact declared canonical archive segment, at most 64 MiB."
              }
            }
          }
        },
        "responses": {
          "204": {
            "description": "Segment accepted and verified"
          },
          "default": {
            "description": "400 for malformed input. 404 workspace_transfer_not_found for a missing or inaccessible transfer. 409 workspace_storage_inactive when the policy is disabled, or workspace_transfer_conflict when state, revision or retry identity changed. 413 workspace_storage_capacity when capacity is exhausted. 503 workspace_transfer_unavailable or workspace_storage_unavailable for transient failures. Authentication and rate limits apply.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/v1/research-workspaces/{id}/transfers/{transfer}/finalize": {
      "post": {
        "operationId": "finalizeWorkspaceTransfer",
