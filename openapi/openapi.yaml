    "/v1/cloud-connections/overview": {
      "get": {
        "operationId": "getCloudOverview",
        "summary": "Read aggregate connected-cloud spend and compute",
        "tags": [
          "Cloud observation"
        ],
        "description": "Aggregates the tenant’s connected accounts and projects. Google legacy whole-export rows are restricted to connected projects. Currencies remain separate, missing days remain unknown, and forecasts require fresh data from every connected scope. Azure onboarding is coming soon.",
        "responses": {
          "200": {
            "description": "Aggregate observation across connected scopes",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "report",
                    "connection_count"
                  ],
                  "properties": {
                    "report": {
                      "$ref": "#/components/schemas/CloudObservationReport"
                    },
                    "connection_count": {
                      "type": "integer",
                      "minimum": 0
                    }
                  }
                }
              }
            }
          },
          "default": {
            "description": "Authentication, administrator access, invalid input, missing records, conflicts, rate limits, credential storage, and transient failures are returned using the stable error and message fields.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "days",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "enum": [
                7,
                30
              ],
              "default": 30
            },
            "description": "Measured history window in days."
          },
          {
            "name": "horizon",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "enum": [
                7,
                30
              ],
              "default": 30
            },
            "description": "Usage-continuation forecast horizon in days."
          }
        ]
      }
    },
    "/v1/agents/{id}/groups": {
      "get": {
        "operationId": "listManagedAgentGroups",
        "summary": "Discover retained groups for an agent definition",
        "tags": [
          "Managed agents"
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "after",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "Group ID from next_after. Must belong to the same tenant and agent definition."
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Retained groups in descending creation order",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "groups": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/ManagedAgentGroup"
                      }
                    },
                    "next_after": {
                      "type": "string",
                      "description": "Use as after for the next page. Empty when no older groups remain."
                    }
                  },
                  "required": [
                    "groups",
                    "next_after"
                  ]
                }
              }
            }
          },
          "404": {
            "description": "Definition or cursor is missing or not owned by this tenant and definition",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SandboxError"
                }
              }
            }
          },
          "default": {
            "description": "Operation refused with a diagnostic and next action",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SandboxError"
                }
              }
            }
          }
        },
        "description": "Accepts API-key and console-session authentication. Returns retained active and cancelled groups for the owned definition, including while new admission is disabled. Groups are ordered by creation time descending, then group ID descending. Each page is a consistent read-only snapshot. Newer groups are discovered by restarting from the first page. Listing does not grant admission entitlement, increase execution limits or reserve spending."
      }
    },
    "/v1/agent-groups": {
      "post": {
        "operationId": "createManagedAgentGroup",
        "summary": "Create a bounded group on one agent definition",
        "tags": [
          "Managed agents"
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Stable key for this logical operation. Reuse the same key and body after an uncertain response."
          }
        ],
        "responses": {
          "202": {
            "description": "Accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ManagedAgentGroup"
                }
              }
            }
          },
          "404": {
            "description": "Group or definition is missing or belongs to another tenant",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SandboxError"
                }
              }
            }
          },
          "default": {
            "description": "Operation refused with a diagnostic and next action",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SandboxError"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ManagedAgentGroupCreate"
              }
            }
          }
        },
        "description": "Requires explicit group admission entitlement and an owned agent definition. Pins one definition revision. The same submission key and body recover the same group after an uncertain response, including when new admission is disabled. Group limits cannot raise the deployment worker or spending limit."
      }
    },
    "/v1/agent-groups/{id}": {
      "get": {
        "operationId": "getManagedAgentGroup",
        "summary": "Observe group progress and outstanding allocation liability",
        "tags": [
          "Managed agents"
        ],
        "parameters": [
          {
