    "/v1/compute": {
      "get": {
        "operationId": "listCompute",
        "summary": "List instances and training launched by this account",
        "tags": ["Compute"],
        "description": "Requires a Bearer API key or console session. Returns standalone instances and training workloads newest first. Training that shares a sweep_id is one item whose id is sweep_ followed by the sweep id, with a group summary. Paused training holds no compute and lists under history, not in summary.running.training. A sweep is attributed to the launcher of its first submitted run, for both launched_by and the launched_by filter. Running saved workspaces appear in summary.running.workspace and become items only with include=workspaces or type=workspace. Contains no cost or price fields. Rows without recorded attribution report launched_by.client api.",
        "parameters": [
          {"name": "state", "in": "query", "schema": {"type": "string", "enum": ["running", "history"], "default": "running"}},
          {"name": "type", "in": "query", "schema": {"type": "string", "enum": ["instance", "training", "workspace"]}, "description": "workspace selects running saved workspaces and returns no history."},
          {"name": "include", "in": "query", "schema": {"type": "string", "enum": ["workspaces"]}, "description": "Adds running saved workspaces as items of type workspace."},
          {"name": "launched_by", "in": "query", "schema": {"type": "string", "enum": ["me", "agents"]}, "description": "agents selects claude-code, codex, cursor and mcp. me requires a credential associated with a team member."},
          {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}},
          {"name": "cursor", "in": "query", "schema": {"type": "string"}, "description": "Opaque next_cursor from the previous page with the same filters."},
          {"name": "Nodus-Client", "in": "header", "schema": {"type": "string"}, "description": "Launch attribution recorded on creation requests: python-sdk, cli, mcp, claude-code, codex or cursor. console is accepted only from console sessions. Other values are recorded as api."}
        ],
        "responses": {
          "200": {"description": "Compute page", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ComputeList"}}}},
          "default": {"description": "Authentication, rate limits and transient failures apply.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}
        }
      }
    },
    "/v1/compute/groups/{id}": {
      "get": {
        "operationId": "getComputeGroup",
        "summary": "Read one training sweep and its runs",
        "tags": ["Compute"],
        "description": "Requires a Bearer API key or console session. The id is a sweep item id from GET /v1/compute. Group counts cover every member. Items are paged newest first. Returns 404 when the sweep has no training in the caller's account. Contains no cost or price fields.",
        "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^sweep_.+"}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}, {"name": "cursor", "in": "query", "schema": {"type": "string"}}],
        "responses": {
          "200": {"description": "Sweep group", "content": {"application/json": {"schema": {"type": "object", "required": ["group", "items", "next_cursor"], "properties": {"group": {"$ref": "#/components/schemas/ComputeGroup"}, "items": {"type": "array", "items": {"$ref": "#/components/schemas/ComputeItem"}}, "next_cursor": {"type": ["string", "null"]}}}}}},
          "default": {"description": "Authentication, rate limits and transient failures apply.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}
        }
      }
    },
