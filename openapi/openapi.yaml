                "schema": {
                  "type": "string"
                }
              },
              "X-Nodus-Price-Version": {
                "description": "Immutable customer price version used for this request.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/ManagedModelReplay"
                    },
                    {
                      "$ref": "#/components/schemas/Error"
                    }
                  ]
                }
              }
            }
          },
          "413": {
            "description": "The model request exceeds the supported body size.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Nodus account request rate limit reached.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Receipt lookup is temporarily unavailable, or no matching historical receipt exists and managed model access is not enabled for this account. Preserve the original request identity when retrying receipt recovery.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "default": {
            "description": "Authentication, accounting and transient failures use the standard error shape.",
