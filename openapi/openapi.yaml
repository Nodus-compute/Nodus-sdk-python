      "CloudOnboardingInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "provider": {
            "type": "string",
            "enum": [
              "aws",
              "gcp"
            ]
          },
          "name": {
            "type": "string",
            "maxLength": 100,
            "description": "Optional name, trimmed on submission. Empty or omitted values become AWS or Google Cloud for the selected provider. At most 100 UTF-8 bytes."
          },
          "regions": {
            "type": [
              "array",
              "null"
            ],
            "items": {
              "type": "string",
              "pattern": "^[a-z]{2}-[a-z]+-[0-9]+$"
            },
            "maxItems": 100,
            "uniqueItems": true,
            "default": [],
            "description": "Commercial AWS regions only. GovCloud and China partitions are not supported by this connection flow. Omitted, null, or empty discovers all enabled account regions. A nonempty list restricts collection. Region order does not affect idempotency. GCP requires an empty list."
          },
          "project_id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{4,28}[a-z0-9]$",
            "description": "Google Cloud project ID. Required for GCP and omitted for AWS."
          },
          "billing_location": {
            "type": "string",
            "enum": [
              "US",
              "EU"
            ],
            "description": "Location of the dedicated Google Cloud billing dataset. Defaults to US for GCP and is omitted for AWS."
          }
        },
        "required": [
          "provider"
        ],
        "allOf": [
          {
            "if": {
              "properties": {
                "provider": {
                  "const": "gcp"
                }
              }
            },
            "then": {
              "required": [
                "project_id"
              ],
              "properties": {
                "regions": {
                  "maxItems": 0
                }
              }
            },
            "else": {
              "properties": {
                "project_id": false,
                "billing_location": false
              }
            }
          }
        ]
      },
