      "/v1/workloads/{id}/rl-summary": {
        "get": {
          "operationId": "getRLSummary",
          "summary": "Summarize an RL run's scored tasks and before-and-after comparison",
          "tags": [
            "RL"
          ],
          "parameters": [
            {
              "name": "id",
              "in": "path",
              "required": true,
              "schema": {
                "type": "string"
              }
            }
          ],
          "responses": {
            "200": {
              "description": "Success",
              "content": {
                "application/json": {
                  "schema": {
                    "$ref": "#/components/schemas/RLSummary"
                  }
                }
              }
            },
            "default": {
              "description": "Error. The JSON error and message fields are stable. Additional fields may provide details. Authentication, rate limits, and transient failures apply to all operations.",
              "content": {
                "application/json": {
                  "schema": {
                    "$ref": "#/components/schemas/Error"
                  }
                }
              }
            }
          },
          "description": "Counts every reported attempt once, as its latest report, per phase, and compares baseline with evaluation the way the console's run page does. comparable is false when the phases scored different numbers of attempts or different tasks. measurable is false when the phases are not comparable or every attempt passed or failed in both. When dropped_events is above zero or truncated is true, reason is incomplete_events and neither is true, because missing events could change either score. resolution_pp is the smallest change the task count can show. Figures come from events the workload reported and do not establish general model improvement."
