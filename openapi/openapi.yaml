    "/v1/managed-models/requests/{id}": {
      "get": {
        "operationId": "getManagedModelRequest",
        "summary": "Read a durable managed model billing receipt",
        "tags": [
          "Managed models"
        ],
        "description": "Returns a receipt owned by the authenticated account. Running or unknown requests keep their spending reservation until reconciled. The receipt contains usage and charge evidence without the prompt or generated answer. It is not a response replay endpoint.",
        "parameters": [
          {
