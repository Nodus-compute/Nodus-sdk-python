                "description": "SHA-256 of stored bytes, when available."
              },
              "X-Nodus-Log-Source": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "live-snapshot"
                  ]
                },
                "description": "Present when the response uses retained live output instead of a committed artifact."
              },
              "X-Nodus-Log-Truncated": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "true",
                    "false"
                  ]
                },
                "description": "For a live snapshot, whether capture or response limits truncated the retained output. Cancellation can also omit output not received before termination."
              },
              "X-Nodus-Group-Id": {
                "schema": {
                  "type": "string"
                },
                "description": "Nodus group identifier for distributed snapshots."
              },
              "X-Nodus-Member-Id": {
                "schema": {
                  "type": "string"
                },
                "description": "Nodus member identifier for distributed snapshots."
              },
              "X-Nodus-Log-Expired": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "true",
                    "false"
                  ]
                },
                "description": "Whether the distributed snapshot has passed its retention deadline."
              }
            }
          },
          "default": {
            "description": "Error. The JSON error and message fields are stable. Additional fields may provide details. Authentication, rate limits, and transient failures apply to all operations.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "id"
          },
          {
            "name": "stage",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "stage"
          },
          {
            "name": "generation",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer"
            },
            "description": "Positive generation. Omit for the latest matching recorded log."
          },
          {
            "name": "member_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "Nodus distributed member identifier from workload detail. Required when selecting distributed logs."
          }
        ],
        "description": "Returns a committed log artifact when available. If no artifact matches, returns the latest matching retained live snapshot within 24 hours after termination, limited to 8 MiB per attempt. This is a snapshot, not a live stream. Returns 404 when neither exists. X-Nodus-Stage-Id and X-Nodus-Generation identify the returned attempt. A member_id selects the retained distributed member snapshot and honors stage and generation filters. Distributed logs remain available during cleanup and expire 24 hours after workload termination once the group is closed."
      }
