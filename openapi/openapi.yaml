        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Stable key for this logical operation. Reuse the same key and body after an uncertain response."
          }
        ],
        "responses": {
          "202": {
            "description": "Accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ManagedAgentGroupBatch"
                }
              }
            }
          },
          "404": {
            "description": "Group or definition is missing or belongs to another tenant",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SandboxError"
                }
              }
            }
          },
          "default": {
            "description": "Operation refused with a diagnostic and next action",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SandboxError"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ManagedAgentGroupBatchRequest"
              }
            }
          }
        },
        "description": "Requires authentication and a group owned by the authenticated tenant. A missing or foreign-owned group returns 404. The whole request is limited to 1 MiB. Duplicate task keys, missing dependencies and cycles are rejected atomically. A task key with changed input, dependencies or deadline conflicts. Retrying the same batch key returns its original ordered receipt even after cancellation or admission disablement. Separate tasks have independent sessions and writable state."
      },
      "get": {
        "operationId": "listManagedAgentGroupRuns",
        "summary": "List retained tasks with stable pagination",
        "tags": [
          "Managed agents"
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "after",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "runs": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/ManagedAgentRun"
                      }
                    },
                    "next_after": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "runs",
                    "next_after"
                  ]
                }
              }
            }
          },
          "404": {
            "description": "Group or definition is missing or belongs to another tenant",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SandboxError"
                }
              }
            }
          },
          "default": {
            "description": "Operation refused with a diagnostic and next action",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SandboxError"
                }
              }
            }
          }
        },
        "description": "Requires authentication and a group owned by the authenticated tenant. A missing or foreign-owned group returns 404. Returns existing managed-run projections ordered by run ID. Pass next_after as after and stop at an empty cursor. Cursor ownership is checked. Each page is a separate database snapshot."
      }
    },
    "/v1/agent-groups/{id}/cancel": {
      "post": {
        "operationId": "cancelManagedAgentGroup",
        "summary": "Fence new group work and continue member cleanup",
        "tags": [
          "Managed agents"
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Stable key for this logical operation. Reuse the same key and body after an uncertain response."
          }
        ],
        "responses": {
          "202": {
            "description": "Accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ManagedAgentGroup"
                }
              }
            }
          },
          "404": {
            "description": "Group or definition is missing or belongs to another tenant",
