    "/v1/research-workspaces/{id}": {
      "delete": {
        "operationId": "deleteResearchWorkspace",
        "summary": "Delete a stopped workspace and its saved files",
        "tags": [
          "Research workspaces"
        ],
        "description": "Requires stopped or failed compute with confirmed release and no pending file upload. Cancels a pending schedule, stops storage billing for the current saved files and releases the name and team workspace slot. Past sessions, charges and admitted workloads remain. Files pinned by an existing export or workload remain until their ownership ends. Reuse the same Idempotency-Key after an uncertain response.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Saved workspace identifier."
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1
            },
            "description": "Stable retry key for this exact deletion."
          }
        ],
        "responses": {
          "200": {
            "description": "Workspace deleted or original deletion replayed",
            "headers": {
              "Idempotent-Replayed": {
                "description": "true when this is the saved response for the same retry key.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "id",
                    "name",
                    "deleted",
                    "deleted_at"
                  ],
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "deleted": {
                      "type": "boolean",
                      "const": true
                    },
                    "deleted_at": {
                      "type": "string",
                      "format": "date-time"
                    }
                  }
                }
              }
            }
          },
          "404": {
            "description": "Workspace is unknown, belongs to another team or was deleted with a different retry key.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "workspace_active requires compute to stop and saving to finish. workspace_transfer_pending requires the pending upload to finish or be discarded. idempotency_conflict requires the original request and key.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "default": {
            "description": "Authentication, rate limits, invalid retry keys and transient errors apply.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "patch": {
        "operationId": "updateResearchWorkspaceConfiguration",
        "summary": "Change settings for the next workspace session",
        "tags": ["Research workspaces"],
        "description": "Requires stopped compute with confirmed release and no active file transfer. Send the complete configuration and its observed configuration_revision. Allows editor, SSH public key, GPU resources, session duration changes. Name, environment, project capacity and repository bootstrap remain fixed. Saved files and previous workloads are preserved. An exact retry of already applied settings succeeds. Conflicting changes require reloading and reviewing the current configuration.",
        "parameters": [
          {"name": "id", "in": "path", "required": true, "schema": {"type": "string"}, "description": "Saved workspace identifier."}
        ],
        "requestBody": {
          "required": true,
          "content": {"application/json": {"schema": {
            "type": "object", "required": ["configuration_revision", "configuration"],
            "properties": {
              "configuration_revision": {"type": "string", "pattern": "^[0-9a-f]{64}$"},
              "configuration": {"$ref": "#/components/schemas/ResearchWorkspaceConfiguration"}
            }
          }}}
        },
        "responses": {
          "200": {"description": "Current workspace with saved settings", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ResearchWorkspace"}}}},
          "default": {"description": "400 for invalid settings or revision. 404 for another account or missing workspace. 409 workspace_configuration_changed requires review of current settings. 409 workspace_configuration_busy requires compute and transfers to finish. Authentication and rate limits apply.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SandboxError"}}}}
        }
      },
      "get": {
        "operationId": "getResearchWorkspace",
        "summary": "Read workspace state, costs and tool readiness",
        "tags": ["Research workspaces"],
        "parameters": [
          {"name": "id", "in": "path", "required": true, "schema": {"type": "string"}, "description": "Saved workspace identifier."}
        ],
        "responses": {
          "200": {
            "description": "Current workspace view",
            "content": {
              "application/json": {"schema": {"$ref": "#/components/schemas/ResearchWorkspace"}}
            }
          },
          "default": {
            "description": "404 if this account does not own the workspace. Authentication, rate limits and transient failures also apply.",
            "content": {
              "application/json": {"schema": {"$ref": "#/components/schemas/SandboxError"}}
            }
          }
        }
      }
    },
    "/v1/research-workspaces/{id}/transfers": {
      "post": {
        "operationId": "beginWorkspaceTransfer",
        "summary": "Begin a stopped-workspace file replacement",
        "tags": [
          "Research workspaces"
        ],
        "description": "Available only when included-10gb-v1 or r2-standard-10gb-account-v1 is explicitly active for the deployment and workspace. Compute must be stopped. Requires a nonempty canonical version 3 archive manifest, not a generic archive upload. Retain idempotency_key, manifest and replace_revision together across retries. Previously saved files require the current storage_revision as replace_revision. Beginning a transfer does not change saved files. The SDK folder uploader prepares this canonical manifest and uploads bounded segments.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Workspace identifier owned by this account."
