    "/v1/operations/{version}/{operation}": {
      "post": {
        "operationId": "invokeOperation",
        "summary": "Invoke a versioned workload, sandbox, managed-agent or draft operation",
        "tags": [
          "Operations"
        ],
        "description": "Workload operations use the same handlers as the direct routes. The authenticated credential determines team and member access. Submit requires a stable idempotency_key in the JSON arguments. Retry identical arguments after an uncertain response. Validation starts no compute and does not guarantee admission. Logs return text. Workload operations preserve their direct-route JSON response shape. Run drafts require a member-attributed credential and are isolated by team and member. Updates require expected_revision and a partial patch. Omitted fields remain unchanged and null removes a field. An immediate identical retry returns its saved revision. A conflicting edit returns HTTP 409 with run_draft_conflict. Draft operations do not submit workloads or authorize spending. Unsupported operations or versions return 404. Sandbox and managed-agent operations use the same owning handlers as their direct routes and return their existing receipts. All mutations in these families require caller-stable idempotency keys. Live file reads run a helper and can wake paid compute. Observation tools never wait for execution completion.",
        "parameters": [
          {
            "name": "version",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "v1"
              ]
            },
            "description": "Operation contract version. Unknown versions return 404."
          },
          {
            "name": "operation",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "workloads.list",
                "workloads.get",
                "workloads.events",
                "workloads.logs",
                "workloads.outputs",
                "workloads.validate",
                "run_draft.get",
                "workloads.submit",
                "workloads.cancel",
                "run_draft.update",
                "sandboxes.capabilities",
                "sandboxes.templates",
                "sandboxes.create",
                "sandboxes.list",
                "sandboxes.get",
                "sandboxes.exec",
