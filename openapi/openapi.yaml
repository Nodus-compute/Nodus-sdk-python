          },
          "dataset_bytes": {
            "type": "integer",
            "minimum": 0
          },
          "peak_memory_gb": {
            "type": "number",
            "minimum": 0,
            "description": "Finite nonnegative memory requirement per GPU in GB. Memory is not pooled across devices. Zero or omission lets Nodus infer memory. The Python SDK requires a positive value when explicitly supplied."
          },
          "notes": {
            "type": "string"
          },
          "gpu": {
            "type": "string",
            "description": "Optional required GPU model family, such as H100. Memory is specified separately. Nodus does not substitute another model."
          },
          "expected_runtime_hours": {
            "type": "number",
            "deprecated": true,
            "description": "Legacy wire compatibility only. Customers do not need to supply a runtime estimate. It does not determine spending admission."
          },
          "gpu_count": {
            "type": "integer",
            "enum": [
              1,
              2,
              4,
              8
            ],
            "description": "Exact number of GPUs on one machine. Omission defaults to one GPU or inherits the workload count for a stage. Never split across machines."
          },
          "gpu_interconnect": {
            "type": "string",
            "enum": [
              "",
              "any"
            ],
            "description": "No interconnect guarantee. Requests for NVLink or NVSwitch are rejected until topology can be verified."
          },
          "node_count": {
            "type": "integer",
            "minimum": 1,
            "maximum": 256,
            "description": "Exact machines required. Omission defaults to one or inherits the workload count for a stage. Multi-machine submissions currently return distributed_training_unavailable before allocation. The schema bound is not a qualified production capacity."
          },
          "distribution": {
            "$ref": "#/components/schemas/TrainingDistribution",
            "description": "Explicit framework and process topology. Submissions containing this field currently return distributed_training_unavailable before allocation."
          },
          "total_gpu_count": {
            "type": "integer",
            "minimum": 1,
            "maximum": 2048,
            "description": "Exact total GPUs requested across an allocation. Cannot be combined with node_count or gpu_count. Omission preserves existing per-machine sizing. This expresses resource demand without selecting a supplier or changing the training command. Multi-GPU total requests currently return distributed_training_unavailable before allocation. The schema maximum is not a production capacity guarantee."
          }
        },
        "allOf": [
          {
            "not": {
              "required": [
                "total_gpu_count"
              ],
              "anyOf": [
                {
                  "required": [
                    "node_count"
                  ]
                },
                {
                  "required": [
                    "gpu_count"
                  ]
                }
              ]
            }
          },
          {
            "if": {
              "not": {
                "required": [
                  "total_gpu_count"
                ],
                "properties": {
                  "total_gpu_count": {
                    "minimum": 2
                  }
                }
              }
            },
            "then": {
              "properties": {
                "distribution": {
                  "required": [
                    "processes_per_node"
                  ],
                  "properties": {
                    "processes_per_node": {
                      "minimum": 1
                    }
                  }
                }
              }
            }
          }
        ]
      },
