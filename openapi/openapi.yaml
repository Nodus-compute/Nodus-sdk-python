        "description": "Send an empty JSON object after every segment has been uploaded. A 202 response means verification is queued or still running. Poll the transfer until state is committed or abandoned. Repeating finalize returns 200 only once the transfer is committed. Verification checks the archive, inventory and unchanged replacement revision before publishing saved files.",
